# Scrape de microservicios Spring Boot dentro de la red Docker (stack apps).
# Usar con docker-compose.apps.yml (monta este fichero sobre prometheus.yml).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          environment: docker

  - job_name: catalog-service
    metrics_path: /actuator/prometheus
    # Con --scale catalog-service=N, Docker DNS devuelve una IP por contenedor.
    dns_sd_configs:
      - names: ["catalog-service"]
        type: A
        port: 8080
    relabel_configs:
      # Solo IPs (evita entradas hostname duplicadas en targets).
      - source_labels: [__address__]
        regex: '^((?:[0-9]{1,3}\.){3}[0-9]{1,3}):8080$'
        action: keep
      - target_label: environment
        replacement: docker

  - job_name: media-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["media-service:8080"]
        labels:
          environment: docker

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8080"]
        labels:
          environment: docker

  - job_name: ai-assistant-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["ai-assistant-service:8080"]
        labels:
          environment: docker
