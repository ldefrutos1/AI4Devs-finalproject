spring.jpa.open-in-view=false
spring.datasource.url=jdbc:h2:mem:ai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS ai\\;SET SCHEMA ai
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=ai
spring.flyway.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/mtl
mtl.ai.provider.mode=stub

management.endpoints.web.exposure.include=health,info
