spring.application.name=ai-assistant-service

server.port=8084

spring.jpa.open-in-view=false



# Observabilidad (ADR-0005): Actuator, Prometheus, logs JSON.

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always

management.endpoint.health.probes.enabled=true

management.metrics.tags.application=${spring.application.name}

management.metrics.tags.environment=${APP_ENV:local}

logging.structured.format.console=logstash



# Integración IA (HU-016). En local se usa stub para no depender de OpenAI.

mtl.ai.provider.mode=${MTL_AI_PROVIDER_MODE:stub}
#mtl.ai.provider.mode=${MTL_AI_PROVIDER_MODE:openai}



# OpenAI Responses API (modo openai). La clave nunca debe commitearse.

mtl.ai.openai.api-key=${MTL_OPENAI_API_KEY:${OPENAI_API_KEY:}}

mtl.ai.openai.base-url=${MTL_OPENAI_BASE_URL:https://api.openai.com}

mtl.ai.openai.enrichment-model=${MTL_OPENAI_ENRICHMENT_MODEL:gpt-4.1-mini}

mtl.ai.openai.chat-model=${MTL_OPENAI_CHAT_MODEL:gpt-4.1-mini}

mtl.ai.openai.connect-timeout=${MTL_OPENAI_CONNECT_TIMEOUT:5s}

mtl.ai.openai.read-timeout=${MTL_OPENAI_READ_TIMEOUT:60s}

mtl.ai.openai.retry.max-attempts=${MTL_OPENAI_RETRY_MAX_ATTEMPTS:3}

mtl.ai.openai.retry.initial-backoff=${MTL_OPENAI_RETRY_INITIAL_BACKOFF:500ms}

mtl.ai.openai.retry.max-backoff=${MTL_OPENAI_RETRY_MAX_BACKOFF:3s}

