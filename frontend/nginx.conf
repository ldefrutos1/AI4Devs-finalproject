server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # API: proxy al gateway (mismo origen que el SPA -> sin CORS).
  location /api/ {
    proxy_pass http://api-gateway:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Chunks Vite: nunca devolver index.html si falta el fichero (evita "Failed to fetch dynamically imported module").
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA: history-fallback para rutas de Vue Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
